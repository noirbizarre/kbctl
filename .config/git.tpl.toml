# git-tpl — https://noirbizarre.github.io/git-tpl/configuration/
#
# This file is versioned with the project. Edit an answer and run
# `git tpl update` to re-render the template with it.

[template]
source = "https://github.com/noirbizarre/rust.tpl"

[answers]
archive = true
aur = true
aur_package_name = "kbctl"
author = "Axel Haustant"
bin_name = "kbctl"
categories = "command-line-utilities"
copyright_holder = "Axel Haustant"
copyright_year = 2026
crate = "kbctl"
description = "A unified control plane for programmable keyboards"
docs = false
gh_ship_token_mode = "app"
homebrew = true
homebrew_tap = "noirbizarre/homebrew-tap"
keywords = "cli, keyboard"
kind = "binary"
man_pages = true
mbx = true
msrv = true
msrv_version = "1.88"
owner = "noirbizarre"
publish = true
rolling_prerelease = false
service = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
